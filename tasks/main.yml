---
- name: Ensure Podman is installed
  become: true
  ansible.builtin.package:
    name: podman
    state: present

- name: Enable systemd lingering for the user
  become: true
  ansible.builtin.command:
    cmd: "loginctl enable-linger {{ ansible_user }}"
    creates: "/var/lib/systemd/linger/{{ ansible_user }}"

- name: Create PyKMIP configuration directory
  become: true
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    recurse: true
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0750"
  loop:
    - /opt/pykmip/
    - /opt/pykmip/config/certs/
    - /opt/pykmip/config/policies/

- name: Build PyKMIP image
  ansible.builtin.include_tasks: build.yml

- name: Run PyKMIP container
  ansible.builtin.include_tasks: run.yml
