---
- name: Create Podman Quadlet directory
  become_user: "{{ ansible_user }}"
  ansible.builtin.file:
    path: ~/.config/containers/systemd/
    state: directory
    mode: "0755"

- name: Create Quadlet for PyKMIP container
  become_user: "{{ ansible_user }}"
  ansible.builtin.template:
    src: pykmip.container.j2
    dest: "~/.config/containers/systemd/{{ pykmip_container_name }}.container"
    mode: '0644'

- name: Enable and start PyKMIP container via Quadlet
  become_user: "{{ ansible_user }}"
  ansible.builtin.systemd:
    name: "{{ pykmip_container_name }}.service"
    enabled: true
    state: started
    daemon_reload: true
    scope: user
