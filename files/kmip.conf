[server]
hostname = 0.0.0.0
port = 5696
certificate_path = /etc/pykmip/certs/server.crt
key_path = /etc/pykmip/certs/server.key
ca_path = /etc/pykmip/certs/ca.crt
auth_suite = TLS1.2
policy_path = /etc/pykmip/policies
enable_tls_client_auth = True

[logging]
log_path = /var/log/pykmip/server.log
log_level = INFO

[database]
database_path = /etc/pykmip/pykmip.db

[server_pool]
# How many concurrent clients
max_threads = 8
